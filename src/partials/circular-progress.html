{% macro circularProgress(progress, label = "Progress") %}
  <svg
    viewBox="0 0 20 20"
    role="progressbar"
    aria-label="{{ label }}"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="{{ progress }}"
    class="size-7 -rotate-90 fill-none stroke-2"
  >
    <circle cx="10" cy="10" r="8" class="stroke-primary/15" />
    <circle
      cx="10"
      cy="10"
      r="8"
      stroke-dasharray="50"
      stroke-dashoffset="{{ 50 - 50 * progress / 100 }}"
      stroke-linecap="round"
      class="stroke-primary transition-[stroke-dashoffset] duration-300"
    />
  </svg>
{% endmacro %}
