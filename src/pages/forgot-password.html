---
layout: auth.html
---

<div class="mx-auto flex w-full max-w-lg flex-1 flex-col items-center justify-center px-4">
  <a href="#">
    <img src="images/kuina-logo-light.svg" alt="Logo" class="hidden h-16 w-16 light:inline-block" />
    <img src="images/kuina-logo-dark.svg" alt="Logo" class="hidden h-16 w-16 dark:inline-block" />
  </a>

  <h2 class="mt-5 text-2xl font-semibold tracking-tight">Forgot your password?</h2>

  <p class="mt-2 mb-5 text-center text-sm text-muted">
    Enter your email and we'll send you a code to reset your password.
  </p>

  <form action="#" class="w-full">
    <label for="forgot-password-email" class="sr-only">Email</label>
    <input
      id="forgot-password-email"
      name="email"
      type="email"
      autocomplete="email"
      placeholder="Enter your email..."
      class="h-14 w-full rounded-full px-4 outline-hidden focus:ring-2 focus:ring-primary dark:bg-stone-200/5 light:bg-neutral-900/5"
    />

    <button
      class="mt-6 flex h-14 w-full cursor-pointer items-center justify-center rounded-full text-center dark:bg-stone-200 dark:text-stone-950 light:bg-neutral-900 light:text-white"
    >
      Send code
    </button>
  </form>

  <a href="#" class="mt-6 inline-flex items-center gap-x-1.5 text-sm text-muted">
    <i data-lucide="arrow-left" class="size-4"></i>
    Back to log in
  </a>
</div>
